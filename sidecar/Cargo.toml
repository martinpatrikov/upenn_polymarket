[package]
name = "polyfill-sidecar"
version = "0.1.0"
edition = "2021"
description = "Rust sidecar service for Polymarket orderbook streaming and management"

[dependencies]
# Polymarket client
polyfill-rs = { path = "/tmp/polyfill-rs", features = ["stream"] }

# HTTP server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Async runtime
tokio = { version = "1.41", features = ["full"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Numeric types (for OrderBook level conversion)
rust_decimal = { version = "1.36", features = ["serde-with-str"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[[bin]]
name = "polyfill-sidecar"
path = "src/main.rs"
